<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080c"><title>Factory Protocol — Beta</title>
<style>
html,body{height:100%;margin:0;background:#05080c;color:#d9edf5;font-family:Inter,Arial,sans-serif}
main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.box{width:min(520px,100%);border:1px solid #1d4d65;background:#08151d;padding:28px}
h1{margin:0 0 8px;font-size:28px}p{color:#88a6b3;line-height:1.5}
.bar{height:3px;background:#102d39;margin-top:20px;overflow:hidden}.bar i{display:block;height:100%;width:18%;background:#37d9ff;animation:p 1s ease-in-out infinite alternate}
@keyframes p{to{width:92%}}small{display:block;margin-top:14px;color:#ffb547;letter-spacing:.12em}
</style></head><body><main><div class="box"><h1>FACTORY PROTOCOL</h1><p>Carregando v0.5-beta1…</p><div class="bar"><i></i></div><small>EXTERNAL PLAYTEST BUILD</small></div></main>
<script>
(async()=>{
 const total=22;
 try{
  const ps=Array.from({length:total},(_,i)=>fetch(`chunks/part-${String(i+1).padStart(2,'0')}.txt?v=beta1`).then(r=>{if(!r.ok)throw new Error('part '+(i+1));return r.text()}));
  const html=(await Promise.all(ps)).join('');
  document.open();document.write(html);document.close();
 }catch(e){document.querySelector('.box').innerHTML='<h1>Falha ao carregar</h1><p>Recarregue a página. Se o problema continuar, avise o responsável pelo beta.</p><small>'+String(e)+'</small>';}
})();
</script></body></html>
